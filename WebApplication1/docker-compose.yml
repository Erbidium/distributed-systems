services:
  provider:
    build:
      context: .
      dockerfile: ./Provider/Dockerfile
    container_name: provider
    ports:
      - "5001:8080"
      - "5003:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - labnet

  consumer:
    build:
      context: .
      dockerfile: ./Consumer/Dockerfile
    container_name: consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "5002:8080"
    networks:
      - labnet

  gateway:
    build:
      context: .
      dockerfile: ./Gateway.Api/Dockerfile
    container_name: gateway
    depends_on:
      - consumer
    ports:
      - "5000:8080"
    networks:
      - labnet

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
